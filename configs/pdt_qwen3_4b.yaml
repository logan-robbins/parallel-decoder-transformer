# Canonical PDT config: Qwen3-4B Instruct 2507, K=3, V_p=8192, d_notes=256.
#
# This YAML maps 1:1 to pdt.config.schemas.PDTConfig. Any unknown key triggers
# a hard validation error, so typos are caught at load time.

trunk:
  profile: "qwen3_4b_instruct_2507"
  base_model: "Qwen/Qwen3-4B-Instruct-2507"
  revision: "cdbee75f17c01a7cc42f958dc650907174af0554"
  # BF16 plus PyTorch SDPA is the single production path. Local smoke scripts
  # may construct an explicit FP32 config in memory; canonical training never
  # rewrites this file or substitutes another attention implementation.
  torch_dtype: "bfloat16"
  device_map: null
  attn_implementation: "sdpa"
  local_path: null

instrumentation:
  enabled: true
  coordination_source: "bus"
  # Resolve twelve equal-depth bands against the selected trunk profile.
  instrumented_layer_count: 12
  target_layers: [2, 5, 8, 11, 14, 17, 20, 23, 26, 29, 32, 35]
  snc_gate_init: -4.0
  adapter_gate_init: -4.0

sidecar:
  hidden_size: 2560   # Qwen3-4B d_model
  notes_dim: 256      # d_notes
  plan_vocab_size: 8192  # V_p
  num_streams: 3      # K
  snc:
    hidden_size: 2560
    notes_dim: 256
    attention_width: 512
    num_heads: 8      # 512 / 8 = 64 head_dim
    dropout: 0.0
  adapters:
    hidden_size: 2560
    bottleneck_size: 512
    streams: ["stream_0", "stream_1", "stream_2"]
    activation: "gelu"
    dropout: 0.0
  planner_head:
    hidden_size: 2560
    planner_width: 512
    vocab_size: 8192
    num_slots: 16
    dropout: 0.0
  plan_notes_proj:
    planner_width: 512
    notes_dim: 256
  speculation_head:
    hidden_size: 2560
    notes_dim: 256
    num_codebooks: 4     # 4 x log2(256) = 32 bits per dynamic snapshot
    codes_per_codebook: 256
    dropout: 0.0
  stream_classifier:
    hidden_size: 2560
    classifier_width: 512
    num_streams: 3
    dropout: 0.0

runtime:
  streams: ["stream_0", "stream_1", "stream_2"]
  block_size: 32        # tau
  notes_bus:
    snapshot_dim: 256
    lag: 1              # Delta
    dtype: "bfloat16"
    num_codebooks: 4
    codes_per_codebook: 256
    history_blocks: 16  # retain addressed writes through the longest document dependency

training:
  dataset_path: "data/processed/long_form_dependency/qwen3_4b_instruct_2507/train.jsonl"
  eval_dataset_path: "data/processed/long_form_dependency/qwen3_4b_instruct_2507/validation.jsonl"
  telemetry_dir: "experiments/qwen3_4b_instruct_2507"
  batch_size: 1
  max_planner_prompt_length: 256
  max_stream_prompt_length: 512
  max_block_transition_length: 64
  max_teacher_prompt_length: 1024
  max_blocks: 32
  grad_accumulation: 16
  max_steps: 50000
  save_every: 2500
  log_interval: 25
  eval_interval: 10000
  causal_eval_seed: 1729
  causal_eval_bootstrap_samples: 10000
  causal_eval_confidence_level: 0.95
  causal_eval_min_documents: 32
  causal_eval_mutation_producer: "stream_0"
  causal_eval_mutation_block: 0
  causal_eval_mutation_code_offset: 1
  kd_temperature_lm: 2.0
  device: null
  optimizer:
    learning_rate: 2.0e-4
    weight_decay: 0.01
    warmup_steps: 1250
    lr_scheduler: "cosine"
  loss_weights:
    lm_ce: 1.0
    kd_lm: 2.0
    planner_vq_commit: 0.25
    planner_vq_codebook: 1.0
    dynamic_vq_commit: 0.25
    dynamic_vq_codebook: 1.0
    planner_codebook_usage: 0.0
    dynamic_codebook_usage: 0.1
    stream_classifier: 0.1
  curriculum:
    stage_schedule: [0, 3750, 10000, 25000]
    stages:
      0:
        name: "diagnostic_mechanism"
        freeze:
          - "trunk"
          - "planner_head"
          - "plan_notes_proj"
          - "stream_classifier"
        unfreeze:
          - "stream_adapters"
          - "snc"
          - "snc_gate"
          - "adapter_gate"
          - "speculation_head"
      1:
        name: "vq_planner_integration"
        freeze:
          - "trunk"
        unfreeze:
          - "planner_head"
          - "plan_notes_proj"
          - "stream_adapters"
          - "snc"
          - "snc_gate"
          - "adapter_gate"
          - "speculation_head"
          - "stream_classifier"
      2:
        name: "integrated_block_rollout"
        freeze:
          - "trunk"
          - "stream_classifier"
        unfreeze:
          - "planner_head"
          - "plan_notes_proj"
          - "stream_adapters"
          - "snc"
          - "snc_gate"
          - "adapter_gate"
          - "speculation_head"
      3:
        name: "late_mechanism_training"
        freeze:
          - "trunk"
        unfreeze:
          - "planner_head"
          - "plan_notes_proj"
          - "stream_adapters"
          - "snc"
          - "snc_gate"
          - "adapter_gate"
          - "speculation_head"
          - "stream_classifier"
